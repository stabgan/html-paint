<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Canvas Paint</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #myCan {
            border: 2px solid #333;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .controls {
            max-width: 800px;
            margin: 20px 0;
        }

        .author-link {
            text-decoration: none;
            color: #dc3545;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .author-link:hover {
            color: #bb2d3b;
        }

        .canvas-container {
            text-align: center;
            margin: 20px 0;
        }

        #canvasout {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 text-center py-3">
                <a href="https://linkedin.com/in/stabgan" class="author-link">
                    Kaustabh Ganguly 2019 - HTML Canvas Paint
                </a>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="myCan" width="800" height="400"></canvas>
        </div>
        
        <div class="controls mx-auto">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="control-group">
                        <button id="xsave" class="btn btn-primary me-2">💾 Save</button>
                        <button id="xclear" class="btn btn-danger">🗑️ Clear</button>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="control-group">
                        <label for="pen-color" class="form-label">Color</label>
                        <input id="pen-color" type="color" class="form-control form-control-color" value="#000000" />
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="control-group">
                        <label for="pen-width" class="form-label">Stroke Width: <span id="width-display">5</span>px</label>
                        <input id="pen-width" type="range" min="1" max="20" value="5" class="form-range" />
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center">
            <h4>Saved Image:</h4>
            <img id="canvasout" style="display:none;" alt="Saved canvas drawing">
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src='script.js'></script>
</body>

</html>
